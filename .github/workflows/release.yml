name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    if: ${{ github.repository == 'jiangxinlei/docfuse' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Run release checks
        run: pnpm test:release

      - name: Pack publishable packages
        run: |
          mkdir release-packages
          pnpm --filter @docfuse/markdown pack --pack-destination release-packages
          pnpm --filter docfuse pack --pack-destination release-packages
          pnpm --filter @docfuse/plugins pack --pack-destination release-packages

      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish_if_missing() {
            package_name="$1"
            archive="$2"
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
            else
              npm publish "${archive}" --access public --provenance
            fi
          }

          publish_if_missing "@docfuse/markdown" "release-packages/docfuse-markdown-${version}.tgz"
          publish_if_missing "docfuse" "release-packages/docfuse-${version}.tgz"
          publish_if_missing "@docfuse/plugins" "release-packages/docfuse-plugins-${version}.tgz"

  github-release:
    name: Create GitHub release
    needs: publish
    if: ${{ github.repository == 'jiangxinlei/docfuse' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping."
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Docfuse ${GITHUB_REF_NAME}"
          fi
