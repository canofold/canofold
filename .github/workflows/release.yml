name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    if: ${{ github.repository == 'canofold/docfuse' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Run release checks
        run: pnpm test:release

      - name: Pack publishable packages
        run: |
          mkdir release-packages
          pnpm --filter @canofold/markdown pack --pack-destination release-packages
          pnpm --filter canofold pack --pack-destination release-packages
          pnpm --filter @canofold/plugins pack --pack-destination release-packages

      - name: Stage packages in dependency order
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage_if_missing() {
            package_name="$1"
            archive="$2"
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
            else
              npm stage publish "${archive}" --access public --provenance
            fi
          }

          stage_if_missing "@canofold/markdown" "./release-packages/canofold-markdown-${version}.tgz"
          stage_if_missing "canofold" "./release-packages/canofold-${version}.tgz"
          stage_if_missing "@canofold/plugins" "./release-packages/canofold-plugins-${version}.tgz"

      - name: Wait for npm 2FA approval
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages=("@canofold/markdown" "canofold" "@canofold/plugins")

          for attempt in $(seq 1 120); do
            pending=()
            for package_name in "${packages[@]}"; do
              if ! npm view "${package_name}@${version}" version >/dev/null 2>&1; then
                pending+=("${package_name}@${version}")
              fi
            done

            if [ "${#pending[@]}" -eq 0 ]; then
              echo "All npm packages are published."
              exit 0
            fi

            echo "Waiting for npm 2FA approval: ${pending[*]}"
            sleep 15
          done

          echo "::error::Timed out waiting for staged npm packages to be approved."
          exit 1

  github-release:
    name: Create GitHub release
    needs: publish
    if: ${{ github.repository == 'canofold/docfuse' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Canofold ${GITHUB_REF_NAME}"
          fi
