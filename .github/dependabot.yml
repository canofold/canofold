version: 2

multi-ecosystem-groups:
  dependency-updates:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependency-updates
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependency-updates
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
